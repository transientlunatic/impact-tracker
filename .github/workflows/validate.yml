name: Validate output data

on:
  pull_request:
    paths:
      - "data/outputs/**"
      - "data/people/**"
      - "data/schema/**"
      - "scripts/validate_outputs.py"
      - "scripts/validate_people.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/validate_people.py
      - run: python scripts/validate_outputs.py
